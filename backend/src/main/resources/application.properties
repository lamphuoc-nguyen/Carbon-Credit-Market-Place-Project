#==============================
# Application Configuration
#==============================
spring.application.name=carboncredit

# ===============================
# Server Configuration
# ===============================
server.port=8080
# ===============================

# ===============================
# Datasource Configuration (SQL Server)
# ===============================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=carbon_credit_db;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:12345}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===============================
# JPA / Hibernate Configuration
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
# Enable JPA auditing for created/updated timestamps
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ===============================
# Spring Security Default User
# ===============================
spring.security.user.name=admin
spring.security.user.password=admin123

# ===============================
# JWT Configuration
# ===============================
jwt.secret=${JWT_SECRET:CarbonCreditMarketplace2025SecureJwtKey9x8y7z6w5v4u3t2s1r0q}
# JWT token expiration time: 1 hour (in milliseconds)
jwt.expiration-ms=3600000

# ===============================
# Async Processing Configuration
# ===============================
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=16
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=carbon-credit-async-

# ===============================
# File Upload Configuration
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===============================
# Logging Configuration
# ===============================
logging.level.org.springframework.security=DEBUG
logging.level.com.carboncredit.security=DEBUG
logging.level.com.carboncredit=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
# ===============================
# Certificate Cloud Storage Configuration
# ===============================
# Google Cloud Storage Configuration
spring.cloud.gcp.storage.enabled=${GCP_STORAGE_ENABLED:false}
spring.cloud.gcp.credentials.location=file:C:/Users/acer/Documents/SWP302/carbon-credit-market-place-0ddd45b00d96.json
gcp.storage.bucket-name=carbon-credit-marketplace-certs-2025

# Certificate Generation Configuration
app.certificate.use-cloud-storage=${USE_CLOUD_STORAGE:false}

# ===============================
# Thymeleaf Configuration
# ===============================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
