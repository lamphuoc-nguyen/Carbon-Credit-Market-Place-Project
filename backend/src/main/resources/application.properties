#==============================
# Application Configuration
#==============================
spring.application.name=carboncredit

# ===============================
# Server Configuration
# ===============================
server.port=8080
# ===============================

# ===============================
# Datasource Configuration (SQL Server)
# ===============================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=carbon_credit_db;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:12345}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===============================
# JPA / Hibernate Configuration
# ===============================
# Use update to allow schema modifications with proper column definitions
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
# Enable JPA auditing for created/updated timestamps
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ===============================
# Spring Security Default User
# ===============================
spring.security.user.name=admin
spring.security.user.password=admin123

# ===============================
# JWT Configuration
# ===============================
jwt.secret=${JWT_SECRET:CarbonCreditMarketplace2025SecureJwtKey9x8y7z6w5v4u3t2s1r0q}
# JWT token expiration time: 1 hour (in milliseconds)
jwt.expiration-ms=3600000

# ===============================
# Async Processing Configuration
# ===============================
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=16
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=carbon-credit-async-

# ===============================
# File Upload Configuration
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===============================
# Logging Configuration
# ===============================
logging.level.org.springframework.security=DEBUG
logging.level.com.carboncredit.security=DEBUG
logging.level.com.carboncredit=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n


# ===============================
# VNPAY Payment Gateway Configuration
# ===============================
# VNPay Configuration
vnpay.url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.return-url=http://localhost:8080/api/payment/vnpay-return
vnpay.tmn-code=3MKHFETO
vnpay.hash-secret=72FYGJPD5WA476G84I4DWHV0UV919G1B
vnpay.api-url=https://sandbox.vnpayment.vn/merchant_webapi/api/transaction
vnpay.version=2.1.0
vnpay.command=pay
vnpay.order-type=other

# ===============================
# Google Cloud Configuration (Disabled by Default)
# ===============================
# Completely disable Google Cloud auto-configuration
gcp.storage.bucket-name=carbon-credit-marketplace-certs-2025
spring.cloud.gcp.core.enabled=true
spring.cloud.gcp.storage.enabled=true
spring.cloud.gcp.credentials.location=file:D:/carbon/Carbon-Credit-Market-Place-Project/carbon-credit-market-place-529f3be21e62.json
app.certificate.use-cloud-storage=true

# ===============================
# Certificate Storage Configuration log
