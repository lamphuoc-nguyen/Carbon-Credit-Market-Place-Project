spring.application.name=carboncredit
spring.profiles.default=dev

server.port=${SERVER_PORT:8080}

spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}

spring.task.execution.pool.core-size=${ASYNC_CORE_SIZE:4}
spring.task.execution.pool.max-size=${ASYNC_MAX_SIZE:16}
spring.task.execution.pool.queue-capacity=${ASYNC_QUEUE_CAPACITY:100}
spring.task.execution.thread-name-prefix=carbon-credit-async-

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
app.frontend.base-url=${APP_FRONTEND_BASE_URL:http://localhost:5173}

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

spring.cloud.gcp.core.enabled=${GCP_ENABLED:false}
spring.cloud.gcp.storage.enabled=${GCP_STORAGE_ENABLED:false}
gcp.storage.bucket-name=${GCP_STORAGE_BUCKET:carbon-credit-marketplace-certs}
app.certificate.use-cloud-storage=${CERTIFICATE_USE_CLOUD_STORAGE:false}

logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}
logging.level.com.carboncredit=${APP_LOG_LEVEL:INFO}
logging.level.org.apache.pdfbox.pdmodel.font=ERROR
logging.level.org.apache.fontbox=ERROR
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
