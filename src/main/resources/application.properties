#==============================
# Application Configuration
#==============================
spring.application.name=carboncredit

# ===============================
# Server Configuration
# ===============================
server.port=8080
# ===============================

# ===============================
# Datasource Configuration (SQL Server)
# ===============================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=carbon_credit_db;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:12345}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===============================
# JPA / Hibernate Configuration
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# ===============================
# Spring Security Default User
# ===============================
spring.security.user.name=admin
spring.security.user.password=admin123

# ===============================
# JWT Configuration
# ===============================
jwt.secret=${JWT_SECRET:supersecretkey0326490191}
jwt.expiration=86400000   # 24 hours

# ===============================
# Logging Configuration
# ===============================
logging.level.org.springframework.security=DEBUG
logging.level.com.gr4.carboncredit.security=DEBUG
logging.level.com.gr4.carboncredit=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
